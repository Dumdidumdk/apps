<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opskriftsbogen</title>
<meta name="description" content="Over 250 madopskrifter med billeder og trin-for-trin guide: aftensmad, pasta, supper, salater, bagværk, kager og meget mere.">
<meta name="theme-color" content="#1F3326">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F3326'/%3E%3Cellipse cx='32' cy='38' rx='22' ry='14' fill='%23fff'/%3E%3Cellipse cx='32' cy='36' rx='14' ry='8' fill='%23E2572F'/%3E%3Ccircle cx='27' cy='34' r='3' fill='%234C9A3A'/%3E%3Ccircle cx='37' cy='35' r='3' fill='%23F2C14E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF; --card:#FFFFFF; --ink:#1F2A22; --muted:#64705F; --line:#ECE4D6; --soft:#F3ECE0;
  --accent:#D9472B; --accent2:#3F8F4A; --good:#2F8F6E; --heart:#E0395A;
  --shadow:0 2px 4px #1F2A220d, 0 12px 28px #1F2A2214; --lift:0 4px 10px #1F2A2214, 0 22px 44px #1F2A2224;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --card:#1C241E; --ink:#EEF3EC; --muted:#AAB7A6; --line:#2C3830; --soft:#243028;
  --accent:#FF7452; --accent2:#6CC47A; --good:#45C29A; --heart:#FF6F8A;
  --shadow:0 2px 4px #0006, 0 12px 28px #0007; --lift:0 4px 10px #0007, 0 22px 44px #000a;
}}
:root[data-theme="dark"]{
  --bg:#121814; --card:#1C241E; --ink:#EEF3EC; --muted:#AAB7A6; --line:#2C3830; --soft:#243028;
  --accent:#FF7452; --accent2:#6CC47A; --good:#45C29A; --heart:#FF6F8A;
  --shadow:0 2px 4px #0006, 0 12px 28px #0007; --lift:0 4px 10px #0007, 0 22px 44px #000a;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Hero */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 85% 0%,#E2572F 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#4C9A3A 0%,transparent 60%),#1F3326;
  padding:calc(22px + env(safe-area-inset-top,0px)) 0 90px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px 8px 10px;border-radius:999px;background:#ffffff1f}
.back:hover{background:#ffffff33}
.tag{font-size:13px;font-weight:700;opacity:.85}
.hero h1{margin:0;font-size:clamp(40px,9vw,86px);line-height:1;font-weight:800}
.hero h1 em{font-style:normal;color:#FFD27A}
.hero p{margin:14px 0 0;max-width:50ch;font-size:clamp(16px,2.3vw,19px);opacity:.92}
.hero .dishes{position:absolute;right:max(16px,calc(50% - 560px));bottom:34px;display:flex;gap:4px;align-items:flex-end;pointer-events:none}
.hero .dishes svg{width:100px;height:auto;filter:drop-shadow(0 10px 18px #0005)}
@media (max-width:820px){.hero .dishes{display:none}}
.hero-wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:60px}

/* Controls */
.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;padding:12px 0}
.controls.stuck{border-bottom-color:var(--line)}
.row1{display:flex;gap:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:50px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Nunito,sans-serif;padding:0 18px 0 46px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent2)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{height:50px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;font-weight:800;white-space:nowrap}
.btn-rand{background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn-rand:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
@media (max-width:520px){.btn-rand span{display:none}.btn-rand{padding:0 15px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 2px 2px}
.chips .chip{flex:none}
@media (max-width:760px){
  .chips{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:none}
}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip small{opacity:.6;font-weight:700;margin-left:4px}
.chip.fav{color:var(--heart)}
.chip.fav[aria-pressed="true"]{background:var(--heart);border-color:var(--heart);color:#fff}
.row2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-top:10px}
.row2 .sel{display:flex;flex-wrap:wrap;gap:8px 14px}
.row2 label{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.row2 select{height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 14px Nunito,sans-serif;padding:0 8px}
.count{font-weight:700;font-size:14px;color:var(--muted)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:18px 0 60px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;padding:0;box-shadow:var(--shadow);transition:transform .2s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--lift)}
.card .pic{aspect-ratio:5/5;display:block;width:100%;overflow:hidden}
.card .pic svg{display:block;width:100%;height:100%;transition:transform .45s ease}
.card:hover .pic svg{transform:scale(1.06)}
.card .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:18px;line-height:1.15}
.card .sub{font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:6px;flex-wrap:wrap}
.card .heart{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#ffffffe6;display:grid;place-items:center;color:var(--heart);box-shadow:0 2px 8px #0002}
.dot{opacity:.5}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--muted)}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#0d140fb3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal.open{opacity:1;pointer-events:auto}
.sheet{position:relative;width:min(980px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:26px;box-shadow:0 30px 80px #0008;transform:translateY(16px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.3,1.1);overscroll-behavior:contain}
.modal.open .sheet{transform:none}
@media (max-width:700px){.modal{padding:0;place-items:end stretch}.sheet{max-height:94dvh;border-radius:24px 24px 0 0}}
.close{position:sticky;top:12px;float:right;margin:12px 12px -56px 0;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:#ffffffe6;color:#1F2A22;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px #0003}
.d-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:760px){.d-grid{grid-template-columns:1fr}}
.d-pic{position:relative;align-self:start;position:sticky;top:0}
.d-pic svg{display:block;width:100%;height:auto;aspect-ratio:200/220}
@media (max-width:760px){.d-pic{position:relative}.d-pic svg{height:300px;aspect-ratio:auto}}
.d-body{padding:28px 28px 32px;display:flex;flex-direction:column;gap:20px}
@media (max-width:520px){.d-body{padding:22px 18px 30px}}
.d-cat{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.d-head{padding-right:52px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-body h2{margin:4px 0 0;font-size:clamp(28px,5vw,42px);line-height:1.05;font-weight:800}
.d-desc{margin:8px 0 0;color:var(--muted);font-size:17px}
.favbtn{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--heart)}
.favbtn[aria-pressed="true"]{background:var(--heart);border-color:var(--heart);color:#fff}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px}
.fact b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fact span{font-weight:800;font-size:15px}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-left:2px}
.meter i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.meter i.on{background:var(--accent)}
.sec h3{margin:0 0 10px;font-size:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec .hint{font:700 13px Nunito,sans-serif;color:var(--muted);margin:-4px 0 10px}
.portion{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px;font:700 14px Nunito,sans-serif}
.portion button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);cursor:pointer;font-size:18px;font-weight:800;box-shadow:0 1px 3px #0002}
.portion span{min-width:92px;text-align:center}
.ing{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ing li{display:grid;grid-template-columns:24px 92px 1fr;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.ing li:first-child{border-top:0}
.ing li .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;color:#fff}
.ing li.done .box{background:var(--good);border-color:var(--good)}
.ing li.done .amt,.ing li.done .nm{text-decoration:line-through;opacity:.5}
.ing .amt{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;cursor:pointer}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:800;font-size:15px}
.steps li.done::before{content:"✓";background:var(--good);color:#fff}
.steps li.done p{opacity:.5}
.steps li p{margin:5px 0 0}
.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:color-mix(in srgb,var(--good) 14%,var(--card));border:1px solid color-mix(in srgb,var(--good) 35%,transparent);border-radius:16px;padding:14px 16px}
.tip b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.nav button{height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;display:inline-flex;align-items:center;gap:6px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Madplan */
.btn-plan{position:relative;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.btn-plan:hover{border-color:var(--accent2)}
.btn-plan .badge{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent2);color:#fff;font-size:12px;display:grid;place-items:center}
.btn-plan .badge[hidden]{display:none}
@media (max-width:520px){.btn-plan span.lbl{display:none}.btn-plan{padding:0 14px}}
.plan-body{padding:26px 26px 32px;display:flex;flex-direction:column;gap:18px}
@media (max-width:520px){.plan-body{padding:20px 14px 28px}}
.plan-body h2{margin:0;font-size:clamp(28px,5vw,40px);line-height:1.05;padding-right:52px}
.ptabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:999px;align-self:flex-start;max-width:100%;overflow-x:auto}
.ptabs button{height:38px;padding:0 16px;border-radius:999px;border:0;background:transparent;cursor:pointer;font-weight:800;white-space:nowrap}
.ptabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 4px #0002}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ptools .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sbtn{height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.sbtn:hover{border-color:var(--accent2)}
.sbtn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}
.sbtn.warn{border-color:var(--accent);color:var(--accent)}
.days{display:flex;flex-direction:column;gap:10px}
.day{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--card)}
.day.today{border-color:var(--accent2);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent2) 30%,transparent)}
@media (max-width:520px){.day{grid-template-columns:1fr auto}.day .dname{grid-column:1/-1}}
.dname{font-weight:800}
.dname small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.dpick{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;min-width:0}
.dpick .mini{flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;display:block}
.dpick .mini svg{width:100%;height:100%;display:block}
.dpick b{display:block;font-size:16px;line-height:1.2}
.dpick small{color:var(--muted);font-weight:700;font-size:13px}
.dact{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:17px;font-weight:800}
.ibtn:hover{border-color:var(--accent2)}
.dadd{justify-self:start;height:40px;padding:0 14px;border-radius:999px;border:2px dashed var(--line);background:transparent;cursor:pointer;font-weight:800;color:var(--muted)}
.dadd:hover{border-color:var(--accent2);color:var(--ink)}
.chooser{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.chooser input{height:44px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Nunito,sans-serif;padding:0 16px}
.chooser input:focus{outline:none;border-color:var(--accent2)}
.pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.pres button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:6px 10px 6px 6px;cursor:pointer;text-align:left;font-weight:700;font-size:14px;line-height:1.2}
.pres button:hover{border-color:var(--accent2)}
.pres .mini{flex:none;width:36px;height:36px;border-radius:10px;overflow:hidden}
.pres .mini svg{width:100%;height:100%;display:block}
.saverow{display:flex;gap:8px;flex-wrap:wrap}
.saverow input{flex:1;min-width:160px;height:42px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 15px Nunito,sans-serif;padding:0 16px}
.saverow input:focus{outline:none;border-color:var(--accent2)}
.note{font-size:13px;color:var(--muted);font-weight:700;margin:0}
.shop{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.shop li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.shop li:first-child{border-top:0}
.shop li .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.shop li.done .box{background:var(--good);border-color:var(--good)}
.shop li.done span:not(.box){text-decoration:line-through;opacity:.5}
.shop .q{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}
.saved{display:flex;flex-direction:column;gap:10px}
.sv{border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sv h3{margin:0;font-size:19px}
.sv p{margin:0;color:var(--muted);font-size:14px}
.sv .grp{display:flex;gap:8px;flex-wrap:wrap}
.empty-s{color:var(--muted);text-align:center;padding:24px 10px}
.toplan{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:16px;padding:12px 14px}
.toplan b{font-size:15px}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.daychips button{height:36px;min-width:52px;padding:0 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;font-size:14px}
.daychips button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.daychips button:hover{border-color:var(--accent2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-weight:800;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px #0004;opacity:0;pointer-events:none;transition:all .2s ease;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{padding:10px 0 calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:14px}
footer a{color:var(--accent);font-weight:800;text-decoration:none}
@media (prefers-reduced-motion:reduce){.card,.card:hover,.card .pic svg,.card:hover .pic svg,.sheet,.modal{transition:none;transform:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="../"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Alle apps</a>
      <span class="tag">Hjemmelavet er bedst</span>
    </div>
    <h1>Opskrifts<em>bogen</em></h1>
    <p id="heroText">Opskrifter med præcise mål og trin-for-trin guide. Tryk på en ret for at se, hvordan du laver den.</p>
  </div>
  <div class="dishes" id="heroDishes" aria-hidden="true"></div>
  <svg class="hero-wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C 240 0, 480 60, 720 30 S 1200 0, 1440 30 L1440 60 L0 60 Z" fill="var(--bg)"/></svg>
</header>

<div class="controls" id="controls">
  <div class="wrap">
    <div class="row1">
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Søg efter ret eller ingrediens, fx 'kylling' eller 'kokos'" autocomplete="off" aria-label="Søg efter ret eller ingrediens">
      </label>

function dishSVG(d, tag){
  var uid = 'p'+d.idx+(tag||''), R = rng(hash(d.n)), main = d.col[0];
  var bgA = mix(main,'#FFFFFF',.8), bgB = mix(main,'#FFFFFF',.6), o=[];
  o.push('<svg viewBox="0 0 200 220" preserveAspectRatio="xMidYMid '+(tag==='b'?'meet':'slice')+'" role="img" aria-label="'+esc(d.n)+'" xmlns="http://www.w3.org/2000/svg">');
  if(tag!=='h'){
    o.push('<defs><linearGradient id="bg'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+bgA+'"/><stop offset="1" stop-color="'+bgB+'"/></linearGradient></defs>');
    o.push('<rect x="-400" y="-200" width="1000" height="620" fill="url(#bg'+uid+')"/>');
    for(var k=0;k<6;k++) o.push('<circle cx="'+Math.round(R()*200)+'" cy="'+Math.round(10+R()*80)+'" r="'+(2+k%3)+'" fill="#fff" opacity=".35"/>');
  }
  var area = (SHAPES[d.v]||SHAPES.plate)(d,o,R);
  var tops = d.top.filter(function(t){return TOP[t];});
  tops.forEach(function(t,ti){
    var n = (t==='sugar'||t==='pepper'||t==='icing'||t==='oil'||t==='cherrysauce'||t==='cream'||t==='egg') ? 1 : 2;
    for(var j=0;j<n;j++){
      var a = (ti*2.1+j*3.3+R()*1.2), r = (tops.length===1&&n===1)?0:(.25+R()*.6);
      var x = area.cx+Math.cos(a)*area.rx*r, y = area.cy+Math.sin(a)*area.ry*r;
      o.push(TOP[t](Math.round(x),Math.round(y),R));
    }
  });
  o.push('</svg>');
  return o.join('').replace(/gc(\d+)/g,'gc$1'+(tag||''));
}

var FR = {0.25:'¼',0.5:'½',0.75:'¾'};
var PLUR = {'skive':'skiver','dåse':'dåser','pose':'poser','knivspids':'knivspidser','portion':'portioner','kop':'kopper'};
function num(v,unit){
  if(unit==='g'){ v = v>=100 ? Math.round(v/5)*5 : Math.round(v); return String(v); }
  var q = Math.round(v*4)/4;
  if(Math.abs(q-v)<0.02 || ['stk','fed','dåse','bundt','skive','blad','pose','knivspids','portion','spsk','tsk'].indexOf(unit)>=0){
    if(q===0) q=0.25;
    var w = Math.floor(q), f = q-w;
    return (w?w:'')+(FR[f]||'') || '0';
  }
  return (Math.round(v*10)/10).toString().replace('.',',');
}
function amt(q,unit,mult){
  if(q==null) return '';
  var v=q*mult;
  if(unit==='g' && v>=1000) return (Math.round(v/100)/10).toString().replace('.',',')+' kg';
  var t = num(v,unit);
  var u = unit; if(v>1 && PLUR[u]) u = PLUR[u];
  return t+(u?' '+u:'');
}
function meter(v,max){ var s='<span class="meter" aria-hidden="true">'; for(var i=1;i<=max;i++) s+='<i class="'+(i<=v?'on':'')+'"></i>'; return s+'</span>'; }
function tidTxt(m){ if(m<60) return m+' min.'; var h=Math.floor(m/60), r=m%60; return h+' t.'+(r?' '+r+' min.':''); }

function hay(d){ return d._h || (d._h = (d.n+' '+d.i.map(function(x){return x[2];}).join(' ')+' '+CATS[d.c]+' '+TYPES[d.k]).toLowerCase()); }

  if(state.q){ var h=hay(d); return state.q.split(/\s+/).every(function(w){return h.indexOf(w)>=0;}); }

function sorter(a,b){

  if(state.sort==='nem') return (a.diff-b.diff)||(a.tid-b.tid)||a.n.localeCompare(b.n,'da');
  return a.n.localeCompare(b.n,'da');
}

    if(d){
      h += '<button class="dpick" data-open="'+d.id+'">'+mini(d)+'<span><b>'+esc(d.n)+'</b><small>'+tidTxt(d.tid)+' · '+CATS[d.c]+'</small></span></button>'+
           '<div class="dact"><button class="ibtn" data-act="swap" data-i="'+i+'" title="Vælg en anden ret" aria-label="Vælg en anden ret til '+name+'">✎</button><button class="ibtn" data-act="rand" data-i="'+i+'" title="Tilfældig ret" aria-label="Tilfældig ret til '+name+'">🎲</button><button class="ibtn" data-act="del" data-i="'+i+'" title="Fjern" aria-label="Fjern retten fra '+name+'">×</button></div>';
    } else {
      h += '<button class="dadd" data-act="swap" data-i="'+i+'">+ Vælg ret</button><div class="dact"><button class="ibtn" data-act="rand" data-i="'+i+'" title="Tilfældig ret" aria-label="Tilfældig ret til '+name+'">🎲</button></div>';
    }
    if(choosing===i){
      h += '<div class="chooser"><input id="pq" type="search" placeholder="Søg efter en ret til '+name.toLowerCase()+'" value="'+esc(chooseQ)+'" autocomplete="off" aria-label="Søg efter ret"><div class="pres" id="pres">'+chooserResults(i)+'</div></div>';
    }
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="saverow"><input id="saveName" value="Uge '+isoWeek(new Date())+'" aria-label="Navn på ugen" maxlength="40"><button class="sbtn pri" data-act="save">Gem ugen</button></div>';
  h += '<p class="note">Madplanen gemmes automatisk i denne browser. Med "Gem ugen" kan du gemme den under et navn og hente den frem igen senere.</p>';
  return h;
}
function chooserResults(i){
  var q = chooseQ.trim().toLowerCase(), list;
  if(q) list = D.filter(function(x){ var hh=hay(x); return q.split(/\s+/).every(function(w){return hh.indexOf(w)>=0;}); });
  else { list = D.filter(function(x){return FAV[x.id];}); if(list.length<8) list = list.concat(D.filter(function(x){return !FAV[x.id] && x.c==='aftensmad';})); }
  list = list.slice(0,12);
  return list.length ? list.map(function(x){return '<button data-set="'+i+'" data-id="'+x.id+'">'+mini(x)+'<span>'+esc(x.n)+'</span></button>';}).join('') : '<p class="note">Ingen retter fundet.</p>';
}
function shopItems(){
  var map = {}, order = [];
  PLAN.days.forEach(function(id){
    var d = id && byId(id); if(!d) return;
    var mult = d.pu ? 1 : PLAN.persons/d.p;
    d.i.forEach(function(x){
      var name = String(x[2]).replace(/\s*\((til|valgfri)[^)]*\)/gi,'').split(',')[0].trim();
      if(!name) return;
      var key = name.toLowerCase()+'|'+(x[0]==null?'-':x[1]);
      if(!map[key]){ map[key] = {key:key, name:name, unit:x[1], q:x[0]==null?null:0, from:[]}; order.push(key); }
      if(x[0]!=null) map[key].q += x[0]*mult;
      if(map[key].from.indexOf(d.n)<0) map[key].from.push(d.n);
    });
  });
  var WHOLE = ['stk','fed','blad','dåse','bundt','pose','skive','portion'];
  order.forEach(function(k){ var x=map[k]; if(x.q!=null && WHOLE.indexOf(x.unit)>=0) x.q = Math.ceil(x.q-0.01); });
  return order.map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,'da');});
}
function drawShop(){
  var items = shopItems();
  if(!items.length) return '<div class="empty-s"><h3>Indkøbslisten er tom</h3><p>Læg nogle retter på ugeplanen, så samler listen selv ingredienserne.</p></div>';
  var left = items.filter(function(x){return !SHOPDONE[x.key];}).length;
  var h = '<div class="ptools"><span class="note">'+left+' af '+items.length+' varer mangler · beregnet til '+PLAN.persons+' '+(PLAN.persons===1?'person':'personer')+'</span><div class="grp"><button class="sbtn" data-act="copy">Kopiér liste</button><button class="sbtn" data-act="unshop">Nulstil flueben</button></div></div>';
  h += '<ul class="shop">'+items.map(function(x){ var a = x.q==null ? '' : amt(x.q,x.unit,1); return '<li data-k="'+esc(x.key)+'" class="'+(SHOPDONE[x.key]?'done':'')+'" title="Til: '+esc(x.from.join(', '))+'"><span class="box">'+(SHOPDONE[x.key]?'✓':'')+'</span><span>'+esc(x.name)+'</span><span class="q">'+a+'</span></li>'; }).join('')+'</ul>';
  h += '<p class="note">Tryk på en vare for at krydse den af. Ting som salt og peber står uden mængde, så du kan tjekke, om du har dem.</p>';
  return h;
}
function drawSaved(){
  if(!SAVED.length) return '<div class="empty-s"><h3>Ingen gemte uger endnu</h3><p>Lav en ugeplan, og tryk på "Gem ugen".</p></div>';
  return '<div class="saved">'+SAVED.map(function(s,i){
    var names = s.days.map(function(id,di){ var d=id&&byId(id); return d ? DAYS[di].slice(0,3)+': '+d.n : null; }).filter(Boolean);
    return '<div class="sv"><h3>'+esc(s.name)+'</h3><p>'+esc(names.join(' · ')||'Ingen retter')+'</p><p>'+s.persons+' personer · gemt '+new Date(s.date).toLocaleDateString('da-DK')+'</p><div class="grp">'+
      '<button class="sbtn pri" data-act="load" data-i="'+i+'">'+(confirmKey==='load'+i?'Tryk igen: erstat nuværende uge':'Brug denne uge')+'</button>'+
      '<button class="sbtn'+(confirmKey==='delsv'+i?' warn':'')+'" data-act="delsv" data-i="'+i+'">'+(confirmKey==='delsv'+i?'Tryk igen for at slette':'Slet')+'</button></div></div>';
  }).join('')+'</div>';
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast('Listen er kopieret');},function(){fallbackCopy(txt);}); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Listen er kopieret'); }catch(e){ toast('Kunne ikke kopiere'); } document.body.removeChild(ta); }

planBody.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab]'); if(t){ planTab=t.dataset.tab; choosing=-1; confirmKey=''; drawPlan(); return; }
  var o = e.target.closest('[data-open]'); if(o){ closePlan(false); openRecipe(o.dataset.open); return; }
  var s = e.target.closest('[data-set]'); if(s){ var di=+s.dataset.set; PLAN.days[di]=s.dataset.id; choosing=-1; chooseQ=''; savePlan(); toast(byId(s.dataset.id).n+' er lagt på '+DAYS[di].toLowerCase()); return; }
  var li = e.target.closest('.shop li'); if(li){ var k=li.dataset.k; if(SHOPDONE[k]) delete SHOPDONE[k]; else SHOPDONE[k]=1; store('opskrifter-indkob',SHOPDONE); drawPlan(); return; }
  var b = e.target.closest('[data-act]'); if(!b) return;
  var act = b.dataset.act, i = +b.dataset.i, prevConfirm = confirmKey; confirmKey = '';
  if(act==='pminus'||act==='pplus'){ PLAN.persons = Math.min(20,Math.max(1,PLAN.persons+(act==='pplus'?1:-1))); savePlan(); }
  else if(act==='fill'){ var used = PLAN.days.filter(Boolean), n=0; PLAN.days = PLAN.days.map(function(id){ if(id && byId(id)) return id; var r=pickRandom(used); if(!r) return null; used.push(r.id); n++; return r.id; }); savePlan(); toast(n ? n+' dage er fyldt ud' : 'Alle dage har allerede en ret'); }
  else if(act==='clear'){ if(prevConfirm==='clear'){ PLAN.days=[null,null,null,null,null,null,null]; SHOPDONE={}; store('opskrifter-indkob',SHOPDONE); savePlan(); toast('Ugen er ryddet'); } else { confirmKey='clear'; drawPlan(); } }
  else if(act==='swap'){ choosing = choosing===i ? -1 : i; chooseQ=''; drawPlan(); }
  else if(act==='rand'){ var r = pickRandom(PLAN.days.filter(Boolean)); if(r){ PLAN.days[i]=r.id; savePlan(); } }
  else if(act==='del'){ PLAN.days[i]=null; savePlan(); }
  else if(act==='save'){
    var nm = (document.getElementById('saveName').value||'').trim() || ('Uge '+isoWeek(new Date()));
    if(!PLAN.days.some(Boolean)){ toast('Læg mindst én ret på planen først'); return; }
    var ex = SAVED.filter(function(x){return x.name.toLowerCase()===nm.toLowerCase();})[0];
    var rec = {name:nm, date:Date.now(), days:PLAN.days.slice(), persons:PLAN.persons};
    if(ex) SAVED[SAVED.indexOf(ex)] = rec; else SAVED.unshift(rec);
    store('opskrifter-planer', SAVED); toast(ex ? '"'+nm+'" er opdateret' : '"'+nm+'" er gemt'); drawPlan();
  }
  else if(act==='load'){
    var sv = SAVED[i]; if(!sv) return;
    if(PLAN.days.some(Boolean) && prevConfirm!=='load'+i){ confirmKey='load'+i; drawPlan(); return; }
    PLAN = {days:sv.days.slice(), persons:sv.persons||4}; SHOPDONE={}; store('opskrifter-indkob',SHOPDONE); planTab='uge'; savePlan(); toast('"'+sv.name+'" er hentet');
  }
  else if(act==='delsv'){ if(prevConfirm==='delsv'+i){ var gone=SAVED.splice(i,1)[0]; store('opskrifter-planer',SAVED); toast('"'+gone.name+'" er slettet'); drawPlan(); } else { confirmKey='delsv'+i; drawPlan(); } }
  else if(act==='copy'){
    var items = shopItems().filter(function(x){return !SHOPDONE[x.key];});
    copyText('Indkøbsliste ('+PLAN.persons+' pers.)\n'+items.map(function(x){ var a = x.q==null?'':amt(x.q,x.unit,1); return '- '+x.name+(a?': '+a:''); }).join('\n'));
  }
  else if(act==='unshop'){ SHOPDONE={}; store('opskrifter-indkob',SHOPDONE); drawPlan(); }
});
planBody.addEventListener('input', function(e){ if(e.target.id==='pq'){ chooseQ = e.target.value; var p=document.getElementById('pres'); if(p) p.innerHTML = chooserResults(choosing); } });

function openPlan(push){
  if(current) closeRecipe(false);
  if(!planOpen) lastFocus = document.activeElement;
  planOpen = true; choosing = -1; confirmKey = ''; drawPlan();
  planModal.classList.add('open'); document.body.classList.add('locked'); planSheet.scrollTop = 0;
  document.getElementById('planClose').focus({preventScroll:true});
  if(push!==false) history.pushState({p:1}, '', '#madplan');
  document.title = 'Madplan · Opskriftsbogen';
}
function closePlan(push){
  planOpen = false; planModal.classList.remove('open'); document.body.classList.remove('locked');
  document.title = 'Opskriftsbogen';
  if(push!==false && location.hash) history.pushState({}, '', location.pathname+location.search);
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
document.getElementById('planBtn').addEventListener('click', function(){ openPlan(); });
document.getElementById('planClose').addEventListener('click', function(){ closePlan(); });
planModal.addEventListener('click', function(e){ if(e.target===planModal) closePlan(); });

/* ================= Hændelser ================= */
document.getElementById('cats').addEventListener('click', function(e){ var b=e.target.closest('.chip'); if(!b) return; state.cat=b.dataset.c; renderFilters(); render(); });
document.getElementById('type').addEventListener('change', function(e){ state.type=e.target.value; render(); });
document.getElementById('time').addEventListener('change', function(e){ state.time=+e.target.value; render(); });
document.getElementById('sort').addEventListener('change', function(e){ state.sort=e.target.value; render(); });
document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value.trim().toLowerCase(); render(); });
grid.addEventListener('click', function(e){ var c=e.target.closest('.card'); if(c) openRecipe(c.dataset.id); });
document.getElementById('rand').addEventListener('click', function(){ var pool=D.filter(matches); if(!pool.length) pool=D; openRecipe(pool[Math.floor(Math.random()*pool.length)].id); });
document.getElementById('close').addEventListener('click', function(){ closeRecipe(); });
modal.addEventListener('click', function(e){ if(e.target===modal) closeRecipe(); var g=e.target.closest('[data-go]'); if(g){ openRecipe(g.dataset.go, false); history.replaceState({d:g.dataset.go},'','#'+g.dataset.go); } });
document.addEventListener('keydown', function(e){
  if(planOpen && e.key==='Escape'){ if(choosing>=0){ choosing=-1; drawPlan(); } else closePlan(); return; }
  if(!current) return;
  if(e.key==='Escape') closeRecipe();
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ var b=modal.querySelectorAll('[data-go]')[e.key==='ArrowRight'?1:0]; if(b) b.click(); }
});
window.addEventListener('popstate', function(){
  var id=location.hash.slice(1);
  if(id==='madplan'){ openPlan(false); return; }
  if(planOpen) closePlan(false);
  if(id) openRecipe(id,false); else if(current) closeRecipe(false);
});
var controls = document.getElementById('controls');
window.addEventListener('scroll', function(){ controls.classList.toggle('stuck', controls.getBoundingClientRect().top<=0); }, {passive:true});

/* ================= Start ================= */
document.getElementById('heroText').textContent = D.length+' opskrifter med præcise mål og trin-for-trin guide. Tryk på en ret for at se, hvordan du laver den.';
var heroPick = ['hjemmelavet-pizza','spaghetti-bolognese','amerikanske-pandekager','tomatsuppe'].map(function(id){return D.filter(function(d){return d.id===id;})[0];}).filter(Boolean);
document.getElementById('heroDishes').innerHTML = heroPick.map(function(d){return dishSVG(d,'h');}).join('');
renderFilters(); renderTypes(); render(); updateBadge();
if(location.hash==='#madplan') openPlan(false);
else if(location.hash.length>1) openRecipe(location.hash.slice(1), false);
})();
</script>
