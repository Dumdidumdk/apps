<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drinksbogen</title>
<meta name="description" content="Over 100 drinksopskrifter med billeder og trin-for-trin guide: klassikere, sours, longdrinks, tropiske, shots og alkoholfri.">
<meta name="theme-color" content="#2A1B3D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232A1B3D'/%3E%3Cpath d='M14 16h36L32 38z' fill='%23FF6F91'/%3E%3Cpath d='M32 38v14M22 52h20' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6F0; --card:#FFFFFF; --ink:#24182F; --muted:#6D6176; --line:#EEE3D8; --soft:#F4ECE3;
  --accent:#E8456E; --accent2:#7B5CFF; --good:#1FA28E;
  --shadow:0 2px 4px #24182F0d, 0 12px 28px #24182F14; --lift:0 4px 10px #24182F14, 0 22px 44px #24182F24;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150F1C; --card:#211829; --ink:#F6EEF8; --muted:#BDB0C6; --line:#33273F; --soft:#2A2034;
  --accent:#FF6F91; --accent2:#9B85FF; --good:#3CC7B1;
  --shadow:0 2px 4px #0006, 0 12px 28px #0007; --lift:0 4px 10px #0007, 0 22px 44px #000a;
}}
:root[data-theme="dark"]{
  --bg:#150F1C; --card:#211829; --ink:#F6EEF8; --muted:#BDB0C6; --line:#33273F; --soft:#2A2034;
  --accent:#FF6F91; --accent2:#9B85FF; --good:#3CC7B1;
  --shadow:0 2px 4px #0006, 0 12px 28px #0007; --lift:0 4px 10px #0007, 0 22px 44px #000a;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Hero */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 85% 0%,#FF6F91 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#7B5CFF 0%,transparent 60%),#2A1B3D;
  padding:calc(22px + env(safe-area-inset-top,0px)) 0 90px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px 8px 10px;border-radius:999px;background:#ffffff1f}
.back:hover{background:#ffffff33}
.age{font-size:13px;font-weight:700;opacity:.85}
.hero h1{margin:0;font-size:clamp(42px,9vw,86px);line-height:1;font-weight:800}
.hero h1 em{font-style:normal;color:#FFD27A}
.hero p{margin:14px 0 0;max-width:50ch;font-size:clamp(16px,2.3vw,19px);opacity:.92}
.hero .glasses{position:absolute;right:max(16px,calc(50% - 560px));bottom:34px;display:flex;gap:6px;align-items:flex-end;pointer-events:none}
.hero .glasses svg{width:92px;height:auto;filter:drop-shadow(0 10px 18px #0005)}
@media (max-width:820px){.hero .glasses{display:none}}
.hero-wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:60px}

/* Controls */
.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;padding:12px 0}
.controls.stuck{border-bottom-color:var(--line)}
.row1{display:flex;gap:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:50px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Nunito,sans-serif;padding:0 18px 0 46px;box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent2)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{height:50px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;font-weight:800;white-space:nowrap}
.btn-rand{background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn-rand:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
@media (max-width:520px){.btn-rand span{display:none}.btn-rand{padding:0 15px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip small{opacity:.6;font-weight:700;margin-left:4px}
.row2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-top:10px}
.row2 label{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.row2 select{height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 14px Nunito,sans-serif;padding:0 8px}
.count{font-weight:700;font-size:14px;color:var(--muted)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:18px 0 60px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;padding:0;box-shadow:var(--shadow);transition:transform .2s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--lift)}
.card .pic{aspect-ratio:5/6;display:block;width:100%}
.card .pic svg{display:block;width:100%;height:100%;transition:transform .45s ease}
.card:hover .pic svg{transform:scale(1.06)}
.card .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-size:19px;line-height:1.15}
.card .sub{font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:6px;flex-wrap:wrap}
.dot{opacity:.5}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--muted)}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#120a18b3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal.open{opacity:1;pointer-events:auto}
.sheet{position:relative;width:min(980px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:26px;box-shadow:0 30px 80px #0008;transform:translateY(16px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.3,1.1);overscroll-behavior:contain}
.modal.open .sheet{transform:none}
@media (max-width:700px){.modal{padding:0;place-items:end stretch}.sheet{max-height:94dvh;border-radius:24px 24px 0 0}}
.close{position:sticky;top:12px;float:right;margin:12px 12px -56px 0;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:#ffffffe6;color:#24182F;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px #0003}
.d-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:760px){.d-grid{grid-template-columns:1fr}}
.d-pic{position:relative}
.d-pic svg{display:block;width:100%;height:100%;min-height:320px;max-height:560px}
@media (max-width:760px){.d-pic svg{max-height:360px;min-height:0;aspect-ratio:5/5}}
.d-body{padding:28px 28px 32px;display:flex;flex-direction:column;gap:20px}
@media (max-width:520px){.d-body{padding:22px 18px 30px}}
.d-cat{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.d-body h2{margin:4px 0 0;font-size:clamp(30px,5vw,44px);line-height:1.05;font-weight:800}
.d-desc{margin:8px 0 0;color:var(--muted);font-size:17px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px}
.fact b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fact span{font-weight:800;font-size:15px}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-left:2px}
.meter i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.meter i.on{background:var(--accent)}
.sec h3{margin:0 0 10px;font-size:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.portion{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px;font:700 14px Nunito,sans-serif}
.portion button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);cursor:pointer;font-size:18px;font-weight:800;box-shadow:0 1px 3px #0002}
.portion span{min-width:78px;text-align:center}
.ing{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ing li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing .amt{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools span{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--soft)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:800;font-size:15px}
.steps li p{margin:5px 0 0}
.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:color-mix(in srgb,var(--good) 14%,var(--card));border:1px solid color-mix(in srgb,var(--good) 35%,transparent);border-radius:16px;padding:14px 16px}
.tip b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.nav button{height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;display:inline-flex;align-items:center;gap:6px;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{padding:10px 0 calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:14px}
footer a{color:var(--accent);font-weight:800;text-decoration:none}
@media (prefers-reduced-motion:reduce){.card,.card:hover,.card .pic svg,.card:hover .pic svg,.sheet,.modal{transition:none;transform:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="../"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Alle apps</a>
      <span class="age">Drik med omtanke · 18+</span>
    </div>
    <h1>Drinks<em>bogen</em></h1>
    <p id="heroText">Opskrifter med præcise mål og trin-for-trin guide. Tryk på en drink for at se, hvordan du laver den.</p>
  </div>
  <div class="glasses" id="heroGlasses" aria-hidden="true"></div>
  <svg class="hero-wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C 240 0, 480 60, 720 30 S 1200 0, 1440 30 L1440 60 L0 60 Z" fill="var(--bg)"/></svg>
</header>

<div class="controls" id="controls">
  <div class="wrap">
    <div class="row1">
      <label class="search"><span class="sr" hidden>Søg</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Søg efter drink eller ingrediens, fx 'gin' eller 'mynte'" autocomplete="off" aria-label="Søg efter drink eller ingrediens">
      </label>
      <button class="btn btn-rand" id="rand" title="Vis en tilfældig drink"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/></svg><span>Overrask mig</span></button>
    </div>
    <div class="chips" id="cats" role="toolbar" aria-label="Kategorier"></div>
    <div class="row2">
      <label>Spiritus <select id="base"></select></label>
      <label>Sortér <select id="sort"><option value="navn">A–Å</option><option value="nem">Nemmeste først</option><option value="let">Letteste først</option></select></label>
      <span class="count" id="count"></span>
    </div>
  </div>
</div>

<main class="wrap"><div class="grid" id="grid"></div></main>

<footer class="wrap">Drik med omtanke, og kør aldrig bil efter alkohol · <a href="../">Tilbage til alle apps</a></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="sheet" id="sheet">
    <button class="close" id="close" aria-label="Luk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="detail"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
var CATS = {klassiker:'Klassikere',sour:'Sours',long:'Longdrinks',bobler:'Bobler',tropisk:'Tropiske',frossen:'Frosne',dessert:'Dessert',varm:'Varme',shot:'Shots',alkoholfri:'Alkoholfri'};
var BASES = {gin:'Gin',vodka:'Vodka',rom:'Rom',tequila:'Tequila & mezcal',whisky:'Whisky',brandy:'Cognac & brandy',likoer:'Likør & aperitif',vin:'Vin & bobler',alkoholfri:'Uden alkohol'};
var GLASS = {martini:'martiniglas',coupe:'coupeglas',rocks:'lavt glas (tumbler)',highball:'highballglas',collins:'collinsglas (højt glas)',wine:'vinglas',flute:'champagneflute',hurricane:'hurricaneglas',margarita:'margaritaglas',shot:'shotglas',mug:'kobberkrus',tiki:'tikikrus',irish:'varmt glas med hank'};
var GLASS_SHORT = {martini:'Martiniglas',coupe:'Coupeglas',rocks:'Lavt glas',highball:'Highball',collins:'Højt glas',wine:'Vinglas',flute:'Flute',hurricane:'Hurricane',margarita:'Margaritaglas',shot:'Shotglas',mug:'Kobberkrus',tiki:'Tikikrus',irish:'Glas med hank'};
var METHOD = {shake:'Rystet',dry:'Rystet med skum',stir:'Rørt',build:'Bygget i glasset',sparkle:'Bygget med bobler',muddle:'Moset',blend:'Blendet',layer:'Lagdelt',hot:'Varm',roll:'Rullet'};
var DIFF = ['','Nem','Mellem','Svær'];

var D = (window.DRINKS||[]).map(function(d,i){
  d.id = slug(d.n); d.idx = i; return d;
});
function slug(s){return s.toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/[éè]/g,'e').replace(/ñ/g,'n').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ================= Illustrationer ================= */
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(a,b,t){var A=hex2rgb(a),B=hex2rgb(b);return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*t);}).join(',')+')';}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}

// Glas-geometri i et 200×240 koordinatsystem
var G = {
  martini:{in:'M40 58 L160 58 L100 134 Z',rim:58,x1:40,x2:160,lvl:70,bot:134,stem:[134,204],base:34},
  coupe:{in:'M42 80 L158 80 C158 120 132 138 100 138 C68 138 42 120 42 80 Z',rim:80,x1:42,x2:158,lvl:90,bot:138,stem:[138,204],base:34},
  rocks:{in:'M50 108 L150 108 L145 202 L55 202 Z',rim:108,x1:50,x2:150,lvl:126,bot:202,thick:8},
  highball:{in:'M64 46 L136 46 L133 204 L67 204 Z',rim:46,x1:64,x2:136,lvl:66,bot:204,thick:8},
  collins:{in:'M70 34 L130 34 L130 204 L70 204 Z',rim:34,x1:70,x2:130,lvl:54,bot:204,thick:8},
  wine:{in:'M56 56 L144 56 C150 110 130 142 100 142 C70 142 50 110 56 56 Z',rim:56,x1:56,x2:144,lvl:90,bot:142,stem:[142,204],base:36},
  flute:{in:'M80 34 L120 34 C123 90 117 130 100 134 C83 130 77 90 80 34 Z',rim:34,x1:80,x2:120,lvl:50,bot:134,stem:[134,204],base:28},
  hurricane:{in:'M66 34 L134 34 C142 78 118 98 122 128 C126 158 142 176 132 194 L68 194 C58 176 74 158 78 128 C82 98 58 78 66 34 Z',rim:34,x1:66,x2:134,lvl:54,bot:194,stem:[194,204],base:32},
  margarita:{in:'M36 66 L164 66 C164 88 132 96 118 100 C112 106 112 120 100 126 C88 120 88 106 82 100 C68 96 36 88 36 66 Z',rim:66,x1:36,x2:164,lvl:74,bot:126,stem:[126,204],base:34},
  shot:{in:'M76 136 L124 136 L118 204 L82 204 Z',rim:136,x1:76,x2:124,lvl:146,bot:204,thick:6},
  irish:{in:'M62 64 L138 64 L131 168 C129 178 71 178 69 168 Z',rim:64,x1:62,x2:138,lvl:74,bot:176,stem:[176,204],base:30,handle:true},
  mug:{in:'M60 84 L140 84 L136 204 L64 204 Z',rim:84,x1:60,x2:140,lvl:90,bot:204,opaque:'copper'},
  tiki:{in:'M62 50 L138 50 L133 204 L67 204 Z',rim:50,x1:62,x2:138,lvl:56,bot:204,opaque:'tiki'}
};

function drinkSVG(d, big){
  var g = G[d.g] || G.rocks, uid = 'd'+d.idx+(big?'b':'s');
  var main = d.col[d.col.length-1], bgA = mix(main,'#FFFFFF',.78), bgB = mix(main,'#FFFFFF',.55);
  var h = hash(d.n), o = [];
  o.push('<svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+esc(d.n)+'" xmlns="http://www.w3.org/2000/svg">');
  o.push('<defs>');
  o.push('<linearGradient id="bg'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+bgA+'"/><stop offset="1" stop-color="'+bgB+'"/></linearGradient>');
  // væske
  var stops='', n=d.col.length;
  if(d.lay && n>1){ for(var i=0;i<n;i++){ stops+='<stop offset="'+(i/n)+'" stop-color="'+d.col[i]+'"/><stop offset="'+((i+1)/n-0.001)+'" stop-color="'+d.col[i]+'"/>'; } }
  else if(n>1){ for(var j=0;j<n;j++) stops+='<stop offset="'+(j/(n-1))+'" stop-color="'+d.col[j]+'"/>'; }
  else stops='<stop offset="0" stop-color="'+d.col[0]+'"/><stop offset="1" stop-color="'+mix(d.col[0],'#000000',.12)+'"/>';
  o.push('<linearGradient id="lq'+uid+'" x1="0" y1="0" x2="0" y2="1">'+stops+'</linearGradient>');
  o.push('<clipPath id="cp'+uid+'"><path d="'+g.in+'"/></clipPath>');
  o.push('</defs>');
  o.push('<rect width="200" height="240" fill="url(#bg'+uid+')"/>');
  // baggrundsprikker
  for(var k=0;k<7;k++){var x=(h>>(k*3))%200, y=((h>>(k*2))*7)%150; o.push('<circle cx="'+x+'" cy="'+(y+6)+'" r="'+(2+k%3)+'" fill="#fff" opacity=".35"/>');}
  // skygge
  o.push('<ellipse cx="100" cy="212" rx="62" ry="8" fill="#000" opacity=".10"/>');
  // stilk/fod

/* ================= Trin-generator ================= */
function amt(q,unit,mult){
  if(unit==='top') return 'Top op';
  if(q==null) return '';
  var v=q*mult, t;
  if(unit==='cl'||unit==='float'||unit==='g'){ t = (Math.round(v*100)/100).toString().replace('.',','); }
  else if(v===0.5) t='½'; else if(v===0.25) t='¼'; else if(v===0.75) t='¾';
  else t = (Math.round(v*10)/10).toString().replace('.',',');
  var u = {cl:'cl',float:'cl',dash:'dash',tsk:'tsk',spsk:'spsk',stk:'stk',blade:'blade',skive:(v>1?'skiver':'skive'),'knivspids':(v>1?'knivspidser':'knivspids'),'dråber':'dråber',kop:(v>1?'kopper':'kop'),g:'g','håndfuld':'håndfuld'}[unit]||unit;
  return t+' '+u;
}
function joinList(a){ if(a.length<2) return a.join(''); return a.slice(0,-1).join(', ')+' og '+a[a.length-1]; }
function iceText(ice){ return ice==='big'?'én stor isterning':ice==='crushed'?'knust is':'isterninger'; }

function buildSteps(d,mult){
  if(d.s) return d.s.slice();
  var gl = GLASS[d.g], S=[];
  var core = d.i.filter(function(x){return x[1]!=='top'&&x[1]!=='float'&&!/til at skylle/.test(x[2]);});
  var tops = d.i.filter(function(x){return x[1]==='top';});
  var floats = d.i.filter(function(x){return x[1]==='float';});
  var list = joinList(core.map(function(x){var a=amt(x[0],x[1],mult);return (a?a+' ':'')+x[2];}));
  var intoIce = !!d.ice;

  if(d.rim){
    var what = d.rim==='salt'?'flagesalt':d.rim==='sukker'?'sukker':'Tajín (chilisalt)';
    S.push('Lav kanten først: Kør en limebåd rundt langs ydersiden af glaskanten, og dyp kanten i en lille tallerken med '+what+'. Bank glasset let, så løse korn falder af.');
  }
  var chill = !intoIce && ['shot','irish','mug','tiki'].indexOf(d.g)<0 && d.m!=='hot';
  if(chill) S.push('Køl dit '+gl+': Sæt det i fryseren i 10 minutter, eller fyld det med is og koldt vand, mens du laver drinken.');
  if(d.rinse) S.push('Hæld et skvæt '+d.rinse+' i glasset, drej glasset rundt, så hele indersiden bliver dækket, og hæld resten ud. Nu dufter glasset.');

  switch(d.m){
    case 'shake':
      S.push('Mål ingredienserne op med et målebæger, og hæld dem i shakeren: '+list+'.');
      S.push('Fyld shakeren cirka ¾ op med friske isterninger, og sæt låget godt på.');
      S.push('Ryst hårdt i 12–15 sekunder, til shakeren er iskold og dugget på ydersiden.');
      if(intoIce) S.push('Fyld '+gl+'et med '+iceText(d.ice)+', og si drinken over isen.');
      else S.push('Tøm glasset for is og vand. Si drinken gennem shakerens si og en fin te-si (dobbeltsining), så der ikke kommer isstumper med.');
      break;
    case 'dry':
      S.push('Hæld det hele i shakeren UDEN is: '+list+'.');
      S.push('Ryst hårdt i 10 sekunder uden is ("dry shake"). Det pisker æggehviden op til et tæt skum.');
      S.push('Åbn shakeren, fyld den ¾ op med is, og ryst igen hårdt i 12 sekunder.');
      if(intoIce) S.push('Fyld '+gl+'et med '+iceText(d.ice)+', og si drinken over. Lad skummet lægge sig i et par sekunder.');
      else S.push('Tøm glasset for is, og dobbeltsi drinken i glasset. Lad skummet lægge sig et øjeblik.');
      break;
    case 'stir':
      S.push('Hæld ingredienserne i et røreglas (eller et stort glas): '+list+'.');
      S.push('Fyld røreglasset godt op med isterninger.');
      S.push('Rør roligt rundt med en lang barske i 20–30 sekunder. Drinken skal være iskold og en smule fortyndet, men ikke vandet.');
      if(intoIce) S.push('Kom '+iceText(d.ice)+' i '+gl+'et, og si drinken over isen.');
      else S.push('Tøm det kolde glas for is, og si drinken i glasset.');
      break;
    case 'build':
      S.push('Fyld '+(d.ice?gl+'et med '+iceText(d.ice):gl+'et')+'.');
      S.push('Hæld ingredienserne direkte i glasset i denne rækkefølge: '+list+'.');
      if(!tops.length) S.push('Rør rundt et par gange med en barske, så drinken bliver kold og blandet.');
      break;
    case 'sparkle':
      S.push((d.ice?'Fyld '+gl+'et med '+iceText(d.ice)+'. ':'Tag et koldt '+gl+'. ')+'Hav alle ingredienser godt nedkølet.');
      S.push('Hæld ingredienserne i glasset i denne rækkefølge: '+list+'. Hæld boblerne langsomt ned langs glassets side, så de ikke skummer over.');
      S.push('Rør én enkelt gang forsigtigt fra bunden og op med en barske, så boblerne bevares.');
      break;
    case 'muddle':
      S.push('Mos '+(d.mud||'de friske ingredienser')+' med en muddler (eller bagenden af en grydeske). Tryk og drej forsigtigt, så saft og duft kommer ud.');
      S.push('Tilsæt resten af ingredienserne: '+joinList(core.filter(function(x){return x[1]!=='blade'&&x[1]!=='skive'&&!/i både|jordbær/.test(x[2]);}).map(function(x){var a=amt(x[0],x[1],mult);return (a?a+' ':'')+x[2];}))+'.');
      if(d.ice==='crushed'){ S.push('Fyld glasset helt op med knust is, og "kværn" drinken: Stik en barske ned i bunden, og drej den mellem hænderne, så det hele blandes og bliver iskoldt.'); S.push('Top op med en ekstra bunke knust is, så den står som et lille bjerg over kanten.'); }
      else { S.push('Fyld med is, ryst eller rør godt i 10–12 sekunder, og si drinken over frisk is i '+gl+'et. Brug en fin si, hvis du ikke vil have blade med.'); }
      break;
    case 'blend':
      S.push('Kom alle ingredienserne i en blender: '+list+'.');
      S.push('Blend på højeste hastighed i 20–30 sekunder, til drinken er helt glat og ligner en slush uden isklumper.');
      S.push('Smag til. Er den for tyk, så tilsæt et skvæt juice. Er den for tynd, så tilsæt lidt mere is, og blend igen.');
      S.push('Hæld den i et '+gl+'.');
      break;
    case 'roll':
      S.push('Hæld alle ingredienserne i en shaker eller et stort glas: '+list+'.');
      S.push('Fyld med is, og "rul" drinken: Hæld den forsigtigt frem og tilbage mellem to glas 4–5 gange. Tomatjuice må ikke rystes, for så bliver den skummet og tynd.');
      S.push('Hæld den over frisk is i '+gl+'et.');
      break;
    case 'layer':
      S.push('Hæld ingredienserne i shotglasset én ad gangen, med den tungeste først: '+list+'. Hæld langsomt over bagsiden af en ske, så de lægger sig i lag.');
      break;
    case 'hot':
      S.push('Varm '+gl+'et op med kogende vand, og hæld vandet ud.');
      S.push('Hæld ingredienserne i det varme glas: '+list+', og rør rundt.');
      break;
  }
  tops.forEach(function(t){ S.push('Top op med '+t[2]+'. Hæld langsomt ned langs en barske, og rør én enkelt gang, så boblerne bevares.'); });
  floats.forEach(function(f){ S.push('Hæld til sidst '+amt(f[0],'float',mult)+' '+f[2]+' meget langsomt over bagsiden af en ske, så det lægger sig som et flot lag øverst.'); });
  S.push(d.gt ? 'Pynt med '+d.gt+', og server med det samme.' : 'Server med det samme, mens den er kold.');
  return S;
}
function tools(d){
  var t=[];
  if(['shake','dry','muddle'].indexOf(d.m)>=0) t.push('Shaker');
  if(d.m==='stir'||d.m==='roll') t.push('Røreglas');
  t.push('Målebæger (jigger)');
  if(['stir','build','sparkle','muddle','roll'].indexOf(d.m)>=0 || d.i.some(function(x){return x[1]==='float'||x[1]==='top';})) t.push('Barske');
  if(['shake','dry','stir'].indexOf(d.m)>=0) t.push('Si');
  if(d.m==='shake'&&!d.ice || d.m==='dry' || d.m==='muddle') t.push('Fin te-si');
  if(d.m==='muddle') t.push('Muddler');
  if(d.m==='blend') t.push('Blender');
  if(d.m==='layer') t.push('Teske');
  if(d.i.some(function(x){return /juice/.test(x[2])&&/frisk/.test(x[2]);})) t.push('Citruspresser');
  t.push(GLASS_SHORT[d.g]);
  return t;
}
function minutes(d){ return ({shake:3,dry:4,stir:3,build:2,sparkle:2,muddle:4,blend:4,layer:3,hot:5,roll:3})[d.m]+(d.rim?1:0); }
function meter(v,max){ var s='<span class="meter" aria-hidden="true">'; for(var i=1;i<=max;i++) s+='<i class="'+(i<=v?'on':'')+'"></i>'; return s+'</span>'; }
var STR = ['Uden alkohol','Let','Mellem','Stærk'];

/* ================= Oversigt ================= */
var state = {cat:'alle', base:'alle', q:'', sort:'navn'};
var grid = document.getElementById('grid');

function renderFilters(){
  var cc = {alle:D.length}; D.forEach(function(d){cc[d.c]=(cc[d.c]||0)+1;});
  var html = '<button class="chip" data-c="alle" aria-pressed="'+(state.cat==='alle')+'">Alle<small>'+D.length+'</small></button>';
  Object.keys(CATS).forEach(function(k){ if(cc[k]) html+='<button class="chip" data-c="'+k+'" aria-pressed="'+(state.cat===k)+'">'+CATS[k]+'<small>'+cc[k]+'</small></button>'; });
  document.getElementById('cats').innerHTML = html;
  var sel = '<option value="alle">Alle</option>'; Object.keys(BASES).forEach(function(k){ sel+='<option value="'+k+'">'+BASES[k]+'</option>'; });
  document.getElementById('base').innerHTML = sel;
}
function matches(d){
  if(state.cat!=='alle' && d.c!==state.cat) return false;
  if(state.base!=='alle' && d.b!==state.base) return false;
  if(state.q){
    var hay = (d.n+' '+d.i.map(function(x){return x[2];}).join(' ')+' '+CATS[d.c]+' '+BASES[d.b]).toLowerCase();
    return state.q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0;});
  }
  return true;
}
function render(){
  var list = D.filter(matches);
  list.sort(function(a,b){
    if(state.sort==='nem') return (a.diff-b.diff)||a.n.localeCompare(b.n,'da');
    if(state.sort==='let') return (a.str-b.str)||a.n.localeCompare(b.n,'da');
    return a.n.localeCompare(b.n,'da');
  });
  document.getElementById('count').textContent = list.length===1 ? '1 drink' : list.length+' drinks';
  if(!list.length){ grid.innerHTML='<div class="empty"><h3>Ingen drinks fundet</h3><p>Prøv et andet søgeord, eller vælg "Alle".</p></div>'; return; }
  grid.innerHTML = list.map(function(d){
    return '<button class="card" data-id="'+d.id+'" aria-label="Se opskrift på '+esc(d.n)+'"><span class="pic">'+drinkSVG(d,false)+'</span><span class="meta"><h3>'+esc(d.n)+'</h3><span class="sub"><span>'+CATS[d.c]+'</span><span class="dot">·</span><span>'+DIFF[d.diff]+'</span></span></span></button>';
  }).join('');
}

/* ================= Detalje ================= */
var modal = document.getElementById('modal'), detail = document.getElementById('detail'), sheet = document.getElementById('sheet');
var current = null, mult = 1, lastFocus = null, visible = [];
function openDrink(id, push){
  var d = D.filter(function(x){return x.id===id;})[0]; if(!d) return;
  if(!modal.classList.contains('open')) lastFocus = document.activeElement;
  current = d; mult = 1; drawDetail();
  modal.classList.add('open'); document.body.classList.add('locked');
  sheet.scrollTop = 0; document.getElementById('close').focus({preventScroll:true});
  if(push!==false) history.pushState({d:id}, '', '#'+id);
  document.title = d.n+' · Drinksbogen';
}
function drawDetail(){
  var d = current;
  visible = D.filter(matches).sort(function(a,b){return a.n.localeCompare(b.n,'da');}); if(visible.indexOf(d)<0) visible = D.slice().sort(function(a,b){return a.n.localeCompare(b.n,'da');});
  var pos = visible.indexOf(d), prev = visible[(pos-1+visible.length)%visible.length], next = visible[(pos+1)%visible.length];
  var ings = d.i.filter(function(x){return !(x[1]==='cl'&&/til at skylle/.test(x[2])&&false);}).map(function(x){ var a = amt(x[0],x[1],mult); return '<li><span class="amt">'+(a||'&nbsp;')+'</span><span>'+esc(x[2])+'</span></li>'; }).join('');
  var steps = buildSteps(d,mult).map(function(s){return '<li><p>'+esc(s)+'</p></li>';}).join('');
  detail.innerHTML =
    '<div class="d-grid"><div class="d-pic">'+drinkSVG(d,true)+'</div><div class="d-body">'+
      '<div><div class="d-cat">'+CATS[d.c]+' · '+BASES[d.b]+'</div><h2 id="dName">'+esc(d.n)+'</h2><p class="d-desc">'+esc(d.d)+'</p></div>'+
      '<div class="facts">'+
        '<div class="fact"><b>Sværhed</b><span>'+DIFF[d.diff]+' '+meter(d.diff,3)+'</span></div>'+
        '<div class="fact"><b>Styrke</b><span>'+STR[d.str]+' '+(d.str?meter(d.str,3):'')+'</span></div>'+
        '<div class="fact"><b>Tid</b><span>ca. '+minutes(d)+' min.</span></div>'+
        '<div class="fact"><b>Metode</b><span>'+METHOD[d.m]+'</span></div>'+
      '</div>'+
      '<section class="sec"><h3>Ingredienser <span class="portion" aria-label="Antal portioner"><button id="minus" aria-label="Færre portioner">−</button><span id="pc">'+mult+' '+(mult===1?'portion':'portioner')+'</span><button id="plus" aria-label="Flere portioner">+</button></span></h3><ul class="ing">'+ings+'</ul></section>'+
      '<section class="sec"><h3>Du skal bruge</h3><div class="tools">'+tools(d).map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div></section>'+
      '<section class="sec"><h3>Sådan gør du</h3><ol class="steps">'+steps+'</ol></section>'+
      '<div class="tip"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--good)"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg><div><b>Bartenderens tip</b>'+esc(d.t)+'</div></div>'+
      '<div class="nav"><button data-go="'+prev.id+'">‹ '+esc(prev.n)+'</button><button data-go="'+next.id+'">'+esc(next.n)+' ›</button></div>'+
    '</div></div>';
  document.getElementById('minus').onclick = function(){ if(mult>1){mult--; redraw();} };
  document.getElementById('plus').onclick = function(){ if(mult<20){mult++; redraw();} };
}
function redraw(){ var st = sheet.scrollTop; drawDetail(); sheet.scrollTop = st; }
function closeDrink(push){
  modal.classList.remove('open'); document.body.classList.remove('locked'); current = null;
  document.title = 'Drinksbogen';
  if(push!==false && location.hash) history.pushState({}, '', location.pathname+location.search);
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}

/* ================= Hændelser ================= */
document.getElementById('cats').addEventListener('click', function(e){ var b=e.target.closest('.chip'); if(!b) return; state.cat=b.dataset.c; renderFilters(); document.getElementById('base').value=state.base; render(); });
document.getElementById('base').addEventListener('change', function(e){ state.base=e.target.value; render(); });
document.getElementById('sort').addEventListener('change', function(e){ state.sort=e.target.value; render(); });
document.getElementById('q').addEventListener('input', function(e){ state.q=e.target.value.trim().toLowerCase(); render(); });
grid.addEventListener('click', function(e){ var c=e.target.closest('.card'); if(c) openDrink(c.dataset.id); });
document.getElementById('rand').addEventListener('click', function(){ var pool=D.filter(matches); if(!pool.length) pool=D; openDrink(pool[Math.floor(Math.random()*pool.length)].id); });
document.getElementById('close').addEventListener('click', function(){ closeDrink(); });
modal.addEventListener('click', function(e){ if(e.target===modal) closeDrink(); var g=e.target.closest('[data-go]'); if(g) openDrink(g.dataset.go, false), history.replaceState({d:g.dataset.go},'','#'+g.dataset.go); });
document.addEventListener('keydown', function(e){
  if(!current) return;
  if(e.key==='Escape') closeDrink();
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ var b=modal.querySelectorAll('[data-go]')[e.key==='ArrowRight'?1:0]; if(b) b.click(); }
});
window.addEventListener('popstate', function(){ var id=location.hash.slice(1); if(id) openDrink(id,false); else if(current) closeDrink(false); });
var controls = document.getElementById('controls');
window.addEventListener('scroll', function(){ controls.classList.toggle('stuck', controls.getBoundingClientRect().top<=0); }, {passive:true});

/* ================= Start ================= */
document.getElementById('heroText').textContent = D.length+' opskrifter med præcise mål og trin-for-trin guide. Tryk på en drink for at se, hvordan du laver den.';
var heroPick = ['aperol-spritz','espresso-martini','mojito','margarita'].map(function(id){return D.filter(function(d){return d.id===id;})[0];}).filter(Boolean);
document.getElementById('heroGlasses').innerHTML = heroPick.map(function(d){return drinkSVG(d,false).replace('<rect width="200" height="240"','<rect width="0" height="0"');}).join('');
renderFilters(); render();
if(location.hash.length>1) openDrink(location.hash.slice(1), false);
})();
</script>
</body>
</html>
